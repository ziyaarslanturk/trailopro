name: Dongu (topla - zenginlestir - guncelle)

# Surekli iyilesen veri dongusu. Her calisma sirandaki TEK ulkeyi isler:
#   data/<ULKE>.json -> ham/ -> (OSM yenile + kullanici kayitlari + zenginlestir) -> kontrol -> data/<ULKE>.json
# Is varsa kendini yeniden tetikler; is yoksa 6 saatte bir uyanip kontrol eder.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      ulke:
        description: "Elle ulke sec (ornek: TR). Bos = siradaki ulke"
        required: false
        default: ""
      osm:
        description: "Elle secilen ulkede OSM'i de yenile"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: trailopro-dongu
  cancel-in-progress: false

jobs:
  dongu:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      FIREBASE_SERVIS_HESABI: ${{ secrets.FIREBASE_SERVIS_HESABI }}
      FIREBASE_TUR: ${{ vars.FIREBASE_TUR }}
      FIREBASE_PROJE: ${{ vars.FIREBASE_PROJE }}
      FIREBASE_KOLEKSIYON: ${{ vars.FIREBASE_KOLEKSIYON }}
      FIREBASE_ULKE_ALANI: ${{ vars.FIREBASE_ULKE_ALANI }}
      FIREBASE_RTDB_URL: ${{ vars.FIREBASE_RTDB_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bagimliliklar
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          pip install --quiet requests numpy "shapely>=2.0" google-auth

      # Wikipedia/GBIF/Nominatim hucre onbellegi (kaybolursa sadece yavaslar, dogruluk etkilenmez)
      - uses: actions/cache@v4
        with:
          path: |
            work/*.hucre.json.gz
            cache/ne_countries.geojson
          key: hucre-${{ github.run_id }}
          restore-keys: hucre-

      - name: Dongu
        id: dongu
        env:
          ULKE: ${{ github.event.inputs.ulke }}
          OSM: ${{ github.event.inputs.osm }}
        run: |
          ARGS=""
          if [ -n "$ULKE" ]; then ARGS="--ulke $ULKE"; [ "$OSM" = "true" ] && ARGS="$ARGS --osm"; fi
          python tools/dongu.py calis $ARGS

      - name: Commit ve push
        id: push
        run: bash tools/git_gonder.sh "${{ steps.dongu.outputs.ulke }}"

      - name: Firebase'deki islenmis kayitlari sil (sadece push basariliysa)
        if: steps.push.outputs.yayinlandi == 'true'
        run: python tools/dongu.py temizle

      - name: Sonraki turu baslat (is varsa)
        if: steps.dongu.outputs.ilerleme == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dongu.yml --ref "${GITHUB_REF_NAME}" || echo "tetiklenemedi; zamanlanmis calisma devam eder"
