name: Dünya kamp taraması

# Ülke ülke OpenStreetMap'ten kamp alanlarını çeker, data/XX.json ile güvenle birleştirir (100 m kuralı, zenginleştirme motoru).
# Hata verse bile iş kırmızı olmaz; sorunlu ülke durum dosyasına işlenir ve bekleme süresinden sonra yeniden denenir.
# Geofabrik ülkelerini (state/osm_md5.json) ve elle eklenmiş dosyaları "Dongu" workflow'u yönetir; bu iş onlara dokunmaz.
on:
  workflow_dispatch:
    inputs:
      mod:
        description: "pilot = sadece LU, pilot/ klasörüne | tam = dünya, data/ klasörüne"
        default: pilot
        type: choice
        options: [pilot, tam]
      ulkeler:
        description: "İsteğe bağlı: virgülle ülke kodları (örn. AD,AL). Boşsa hepsi"
        required: false
        default: ""
      zorla:
        description: "Sahiplik kuralını yoksay (Geofabrik ülkelerini de tara)"
        type: boolean
        default: false
  schedule:
    - cron: "47 */6 * * *"   # tam mod; bitene kadar kaldığı yerden devam eder

permissions:
  contents: write

concurrency:
  group: dunya-tara
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/cache@v4
        with:
          path: work/*.hucre.json.gz
          key: hucre-dunya-${{ github.run_id }}
          restore-keys: hucre-

      - name: Tara ve zenginleştir
        continue-on-error: true      # betik zaten hata vermez; yine de iş kırmızı olmasın
        env:
          MOD: ${{ github.event.inputs.mod || 'tam' }}
          ULKELER: ${{ github.event.inputs.ulkeler }}
          ZORLA: ${{ github.event.inputs.zorla }}
        run: |
          ARGS="--mod $MOD --commit --sure 320"
          if [ -n "$ULKELER" ]; then ARGS="$ARGS --ulkeler $ULKELER"; fi
          if [ "$ZORLA" = "true" ]; then ARGS="$ARGS --zorla"; fi
          node tools/dunya-tara.js $ARGS

      - name: Bekleyen değişiklik kaldıysa gönder
        continue-on-error: true
        run: bash tools/git_gonder.sh dunya
