name: Kamp verisi topla

on:
  workflow_dispatch:
    inputs:
      codes:
        description: "Ulke kodlari (bos birakirsan eksik olan hepsi). Ornek: OM BH AE QA KW SA GB IE"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Araclari kur
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          pip install -r requirements.txt

      - name: Mevcut dosyalari out/ icine al (tekrar indirilmesin)
        run: |
          mkdir -p out data
          cp -n data/*.json out/ 2>/dev/null || true

      - name: Calistir
        env:
          CODES: ${{ github.event.inputs.codes }}
        run: python camp_harvest.py $CODES

      - name: Yeni dosyalari data/ klasorune kopyala
        run: cp -n out/*.json data/ 2>/dev/null || true

      - name: Commit ve push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Kamp verisi guncellendi"
          git push
