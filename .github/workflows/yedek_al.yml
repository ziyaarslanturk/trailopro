name: Data Yedeği Al (Tam Kopya)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/yedek_al.yml'

permissions:
  contents: write

jobs:
  yedekle:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Data Klasörünün Tamamını Yedek Data Klasörüne Kopyala
        run: |
          mkdir -p yedek_data
          cp -r data/* yedek_data/
          echo "Kopyalanan dosya sayısı: $(ls -1 yedek_data | wc -l)"

      - name: Git'e Kaydet ve Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add yedek_data/
          if git diff --staged --quiet; then
            echo "Yedek zaten güncel, commit atlanıyor."
          else
            git commit -m "backup: data klasörünün tamamı yedek_data klasörüne tam kopya olarak alındı"
            git push origin main
          fi
