name: Trailo Pro Zenginlestir

on:
  workflow_dispatch:
    inputs:
      ulke:
        description: 'İşlenecek Ülke Kodu (Örn: TR veya boş bırakın hepsi)'
        required: false
        default: ''
      max_dakika:
        description: 'Maksimum Çalışma Süresi (Dakika)'
        required: false
        default: '30'

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Zenginleştirme Scriptini Çalıştır
        run: |
          node zenginlestir.js --ulke "${{ github.event.inputs.ulke }}" --max-dakika "${{ github.event.inputs.max_dakika }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sadece Veri Değişikliklerini Kaydet ve Pushla
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ 2>/dev/null || true
          git add work/ 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Veri zenginleştirme otomatik güncellemesi [skip ci]" && git push)
