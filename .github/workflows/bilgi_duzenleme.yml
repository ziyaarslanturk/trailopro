name: Bilgi Duzenleme (Dugum ve Kategorilendirme Dongusu)

# Türkiye'den başlayarak tüm ülke kamp alanı verilerini kategorilere ayırır,
# 5 dilde bilgileri düzenler ve sürekli döngü halinde çalışır.

on:
  schedule:
    - cron: "*/15 * * * *"  # Her 15 dakikada bir otomatik çalışır
  workflow_dispatch:
    inputs:
      ulke:
        description: "Elle ülke seç (Örnek: TR). Boş = Sıradaki ülke"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: trailopro-bilgi-duzenleme
  cancel-in-progress: false

jobs:
  bilgi-duzenleme:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Bilgi Düzenleme Aracını Çalıştır
        run: |
          python3 tools/bilgi_duzenleme.py

      - name: Değişiklikleri Git'e Kaydet ve Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ yedek_data/ state/
          if git diff --staged --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git commit -m "auto(data): bilgi düzenleme ve kategorilendirme güncellemesi [skip ci]"
            git push origin main
          fi
