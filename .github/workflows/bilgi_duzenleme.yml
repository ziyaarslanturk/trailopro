name: Bilgi Duzenleme

# Türkiye'den başlayarak tüm ülke kamp alanı verilerini kategorilere ayırır,
# 5 dilde bilgileri düzenler ve var olan data/ klasörünü güncelleyerek kesintisiz çalışır.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: trailopro-bilgi-duzenleme
  cancel-in-progress: false

jobs:
  bilgi-duzenleme:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Bilgi Düzenleme Aracını Çalıştır
        run: |
          python3 tools/bilgi_duzenleme.py

      - name: Değişiklikleri Git'e Kaydet ve Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ state/
          if git diff --staged --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git commit -m "auto(data): bilgi düzenleme güncellemesi [skip ci]"
            git push origin main
          fi

      - name: Sıradaki Ülke İçin Hemen Tekrar Tetikle (Kesintisiz Döngü)
        if: always()
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/bilgi_duzenleme.yml/dispatches \
            -d '{"ref":"main"}' || true
