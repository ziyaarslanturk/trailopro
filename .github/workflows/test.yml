name: Testler
on:
  push:
    paths: ["tools/**", "testler/**", ".github/workflows/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node --test testler/motor.test.js
      - run: python -m unittest discover -s testler
