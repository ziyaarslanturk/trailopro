name: Camp Data Fetch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        code: [TR, DE, FR, IT, ES, AT, CH, NL, BE, GR, HR, PT, NO, SE, GCC, JO, EG, MA, RU, US_WEST, US_SOUTH, US_MIDWEST, US_NORTHEAST, US_PACIFIC, CZ, DK, FI, LU, PL, DZ, TN, GB_IE]
    steps:
      - uses: actions/checkout@v4

      - name: Zaten var mi
        id: chk
        run: |
          case "${{ matrix.code }}" in
            GCC) need="OM BH AE QA KW SA" ;;
            GB_IE) need="GB IE" ;;
            *) need="${{ matrix.code }}" ;;
          esac
          skip=true
          for c in $need; do
            [ -f "data/$c.json" ] || skip=false
          done
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "Atlanacak mi: $skip"

      - uses: actions/setup-python@v5
        if: steps.chk.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Bagimliliklar
        if: steps.chk.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          pip install requests numpy "shapely>=2.0"

      - name: Eski bolge dosyasini hazirla (GCC.json varsa tekrar inmesin)
        if: steps.chk.outputs.skip != 'true'
        run: |
          mkdir -p out
          if [ -f "data/${{ matrix.code }}.json" ]; then cp "data/${{ matrix.code }}.json" out/; fi

      - name: Veriyi cek
        if: steps.chk.outputs.skip != 'true'
        run: python camp_fetch.py ${{ matrix.code }}

      - uses: actions/upload-artifact@v4
        if: steps.chk.outputs.skip != 'true'
        with:
          name: camp-${{ matrix.code }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  commit:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: camp-*
          path: data
          merge-multiple: true

      - name: Depoya commit et
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update camp data"
          git push
