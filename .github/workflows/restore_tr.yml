name: Restore TR.json

on:
  push:
    paths:
      - '.github/workflows/restore_tr.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore TR.json from yedek_data/TR.json
        run: |
          cp yedek_data/TR.json data/TR.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/TR.json
          if git diff --staged --quiet; then
            echo "Zaten güncel."
          else
            git commit -m "revert: TR.json KML birleşimi geri alındı, orijinal yedek yüklendi"
            git push origin main
          fi
